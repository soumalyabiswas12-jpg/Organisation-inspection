<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7-Day Organisation Inspection</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#e5e7eb}
.container{max-width:1200px;margin:auto;padding:24px}.header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
h1{margin:0 0 6px;font-size:28px}.sub{color:#94a3b8}.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:18px;margin-top:18px}
.controls{display:flex;gap:10px;flex-wrap:wrap}.controls input,.controls select{background:#0f172a;color:#fff;border:1px solid #475569;border-radius:8px;padding:10px}
button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700;background:#3b82f6;color:white}button.danger{background:#dc2626}button.secondary{background:#475569}
.tabs{display:flex;gap:8px;overflow:auto;margin-top:16px}.tab{white-space:nowrap}.tab.active{background:#22c55e}
table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px;border-bottom:1px solid #334155;text-align:center}th{color:#cbd5e1;background:#172033;position:sticky;top:0}td:first-child,th:first-child{text-align:left}
.score{width:62px;background:#0f172a;color:#fff;border:1px solid #475569;border-radius:6px;padding:8px;text-align:center}
.max{color:#94a3b8;font-size:12px}.total{font-weight:800;color:#4ade80}.rank{font-weight:800;color:#fbbf24}
.note{font-size:13px;color:#94a3b8;margin-top:10px}.empty{padding:30px;text-align:center;color:#94a3b8}
@media(max-width:700px){.container{padding:14px}h1{font-size:22px}.card{padding:12px}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>📊 7-Day Organisation Inspection</h1>
      <div class="sub">10 categories × 1 point each × 7 days</div>
    </div>
    <button class="danger" onclick="clearAll()">Reset All Data</button>
  </div>

  <div class="card">
    <div class="controls">
      <input id="orgName" placeholder="Organisation name">
      <button onclick="addOrg()">+ Add Organisation</button>
      <button class="secondary" onclick="exportData()">Export JSON</button>
      <label style="display:flex;align-items:center;gap:6px;background:#475569;padding:8px 12px;border-radius:8px;cursor:pointer">
        Import JSON <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      </label>
    </div>
    <div class="note">Each category is scored from 0–1. Maximum: 10 points per day, 70 points for the full week.</div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="card" id="main"></div>
</div>

<script>
const categories = [
"Response time after informing on dept chat",
"Control of senior over junior",
"Activeness based on no. of members online",
"Accomplishments since last inspection",
"Staff behavior",
"Staff RP knowledge",
"Team work / cooperation",
"Communication skills",
"Responsibility / assigned work",
"Overall performance"
];

let data = JSON.parse(localStorage.getItem("inspectionData") || '{"orgs":[],"day":1}');
const defaultOrgs = ["MIA","TP","FSB","GF","ACH","YCH","RTV"];
if (!data.orgs.length) {
  data.orgs = defaultOrgs.map(name => ({name, scores:Array.from({length:7},()=>Array(10).fill(0))}));
  localStorage.setItem("inspectionData", JSON.stringify(data));
}
let currentDay = data.day || 1;

function save(){data.day=currentDay;localStorage.setItem("inspectionData",JSON.stringify(data));}
function addOrg(){
  const el=document.getElementById("orgName"), name=el.value.trim();
  if(!name)return alert("Enter an organisation name.");
  if(data.orgs.some(o=>o.name.toLowerCase()===name.toLowerCase()))return alert("Organisation already exists.");
  data.orgs.push({name,scores:Array.from({length:7},()=>Array(10).fill(0))});
  el.value=""; save(); render();
}
function removeOrg(i){
  if(confirm("Remove "+data.orgs[i].name+"?")){data.orgs.splice(i,1);save();render();}
}
function setScore(oi,ci,val){
  val=Math.max(0,Math.min(1,Number(val)||0));
  data.orgs[oi].scores[currentDay-1][ci]=val;save();render(false);
}
function dayTotal(o,d){return o.scores[d].reduce((a,b)=>a+b,0)}
function weekTotal(o){return o.scores.flat().reduce((a,b)=>a+b,0)}
function renderTabs(){
  document.getElementById("tabs").innerHTML=Array.from({length:7},(_,i)=>
    `<button class="tab ${currentDay===i+1?'active':''}" onclick="currentDay=${i+1};save();render()">Day ${i+1}</button>`
  ).join("");
}
function render(restore=true){
  renderTabs();
  const main=document.getElementById("main");
  if(!data.orgs.length){main.innerHTML='<div class="empty">No organisations added yet. Add one above to begin.</div>';return;}
  let sorted=[...data.orgs].map((o,i)=>({o,i})).sort((a,b)=>weekTotal(b.o)-weekTotal(a.o));
  let rows=sorted.map((x,rank)=>{
    const o=x.o,i=x.i;
    return `<tr>
      <td><span class="rank">#${rank+1}</span> ${escapeHtml(o.name)}
      <br><button class="danger" style="font-size:11px;padding:5px 8px;margin-top:5px" onclick="removeOrg(${i})">Remove</button></td>
      ${categories.map((c,ci)=>`<td><input class="score" type="number" min="0" max="1" step="1" value="${o.scores[currentDay-1][ci]}" title="${c}" onchange="setScore(${i},${ci},this.value)"></td>`).join("")}
      <td class="total">${dayTotal(o,currentDay-1)}/10</td>
      <td class="total">${weekTotal(o)}/70</td>
    </tr>`;
  }).join("");
  main.innerHTML=`
    <h2>Day ${currentDay} Inspection</h2>
    <div style="overflow:auto">
    <table><thead><tr>
      <th>Organisation</th>${categories.map((c,i)=>`<th title="${c}">C${i+1}<br><span class="max">${c}</span></th>`).join("")}
      <th>Day Total</th><th>Week Total</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
    <div class="note">C1 = Response time · C2 = Senior control · C3 = Activeness · C4 = Accomplishments · C5 = Behavior · C6 = RP knowledge · C7 = Teamwork · C8 = Communication · C9 = Responsibility · C10 = Overall.</div>`;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="organisation-inspection.json";a.click();
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);currentDay=data.day||1;save();render();}catch{alert("Invalid JSON file.");}};r.readAsText(f);
}
function clearAll(){
  if(confirm("Reset all points for all organisations? Organisation names will stay unchanged.")){
    data.orgs.forEach(o => {
      o.scores = Array.from({length:7},()=>Array(10).fill(0));
    });
    currentDay = 1;
    data.day = 1;
    save();
    render();
  }
}
render();
</script>
</body>
</html>
