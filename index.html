<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7-Day Organisation Inspection</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:#e5e7eb
}

.container{
max-width:1200px;
margin:auto;
padding:24px
}

.header{
display:flex;
justify-content:space-between;
gap:16px;
align-items:center;
flex-wrap:wrap
}

h1{
margin:0 0 6px;
font-size:28px
}

.sub{
color:#94a3b8
}

.card{
background:#1e293b;
border:1px solid #334155;
border-radius:14px;
padding:18px;
margin-top:18px
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap
}

.controls input{
background:#0f172a;
color:#fff;
border:1px solid #475569;
border-radius:8px;
padding:10px
}

button{
border:0;
border-radius:8px;
padding:10px 14px;
cursor:pointer;
font-weight:700;
background:#3b82f6;
color:white
}

button.danger{
background:#dc2626
}

button.secondary{
background:#475569
}

button.success{
background:#22c55e
}

.tabs{
display:flex;
gap:8px;
overflow:auto;
margin-top:16px
}

.tab{
white-space:nowrap
}

.tab.active{
background:#22c55e
}

table{
width:100%;
border-collapse:collapse;
min-width:850px
}

th,td{
padding:10px;
border-bottom:1px solid #334155;
text-align:center
}

th{
color:#cbd5e1;
background:#172033;
position:sticky;
top:0
}

td:first-child,
th:first-child{
text-align:left
}

.score{
width:62px;
background:#0f172a;
color:#fff;
border:1px solid #475569;
border-radius:6px;
padding:8px;
text-align:center
}

.score:disabled{
opacity:.6;
cursor:not-allowed
}

.max{
color:#94a3b8;
font-size:12px
}

.total{
font-weight:800;
color:#4ade80
}

.rank{
font-weight:800;
color:#fbbf24
}

.note{
font-size:13px;
color:#94a3b8;
margin-top:10px
}

.empty{
padding:30px;
text-align:center;
color:#94a3b8
}

.status{
margin-top:10px;
padding:8px 12px;
border-radius:8px;
background:#172033;
color:#94a3b8;
font-size:13px
}

.loginBox{
display:flex;
gap:10px;
flex-wrap:wrap;
align-items:center
}

.lockStatus{
font-weight:700
}

.hidden{
display:none!important
}

@media(max-width:700px){

.container{
padding:14px
}

h1{
font-size:22px
}

.card{
padding:12px
}

}
</style>
</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

<div>

<h1>📊 7-Day Organisation Inspection</h1>

<div class="sub">
10 categories × 1 point each × 7 days
</div>

</div>

<button
id="resetBtn"
class="danger hidden"
onclick="clearAll()"
>
Reset All Data
</button>

</div>


<!-- PASSWORD CARD -->

<div class="card">

<div class="loginBox">

<input
id="staffPassword"
type="password"
placeholder="Staff password"
>

<button onclick="unlock()">
🔓 Unlock Editing
</button>

<button
id="lockBtn"
class="secondary hidden"
onclick="lockEditing()"
>
🔒 Lock
</button>

</div>


<div
id="lockStatus"
class="note"
>
🔒 Viewing mode — editing is locked
</div>


<div
id="connectionStatus"
class="status"
>
🔄 Connecting to database...
</div>

</div>


<!-- EDIT CONTROLS -->

<div
id="editControls"
class="card hidden"
>

<div class="controls">

<input
id="orgName"
placeholder="Organisation name"
>

<button onclick="addOrg()">
+ Add Organisation
</button>

</div>

</div>


<!-- DAYS -->

<div
class="tabs"
id="tabs"
></div>


<!-- MAIN TABLE -->

<div
class="card"
id="main"
></div>

</div>


<script type="module">

/* =========================================
   FIREBASE IMPORTS
   ========================================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getDatabase,
ref,
onValue,
set
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


/* =========================================
   FIREBASE CONFIG
   ========================================= */

const firebaseConfig = {

apiKey:
"AIzaSyC4mdiU-o-LLNyJ6bQelsPNBwgb6cxrOJ8",

authDomain:
"day-organisation-inspection.firebaseapp.com",

databaseURL:
"https://day-organisation-inspection-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:
"day-organisation-inspection",

storageBucket:
"day-organisation-inspection.firebasestorage.app",

messagingSenderId:
"610739331200",

appId:
"1:610739331200:web:7fb24d5d2b9aa33629c665"

};


/* =========================================
   START FIREBASE
   ========================================= */

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const inspectionRef =
ref(db,"inspectionData");


/* =========================================
   STAFF PASSWORD
   ========================================= */

const STAFF_PASSWORD = "9898";

let editingUnlocked = false;


/* =========================================
   CATEGORIES
   ========================================= */

const categories = [

"Response time after informing on dept chat",

"Control of senior over junior",

"Activeness based on no. of members online",

"Accomplishments since last inspection",

"Staff behavior",

"Staff RP knowledge",

"Team work / cooperation",

"Communication skills",

"Responsibility / assigned work",

"Overall performance"

];


/* =========================================
   DEFAULT ORGANISATIONS
   ========================================= */

const defaultOrgs = [

"MIA",
"TP",
"FSB",
"GF",
"ACH",
"YCH",
"RTV"

];


/* =========================================
   DATA
   ========================================= */

let data = {

orgs:[],
day:1

};

let currentDay = 1;


/* =========================================
   CREATE DEFAULT ORGANISATIONS
   ========================================= */

function createDefaultOrganisations(){

return defaultOrgs.map(name => ({

name:name,

scores:Array.from(
{length:7},
()=>Array(10).fill(0)
)

}));

}


/* =========================================
   UNLOCK
   ========================================= */

window.unlock = function(){

const password =
document.getElementById(
"staffPassword"
).value;


if(password === STAFF_PASSWORD){

editingUnlocked = true;

document.getElementById(
"staffPassword"
).value = "";

document.getElementById(
"editControls"
).classList.remove("hidden");

document.getElementById(
"resetBtn"
).classList.remove("hidden");

document.getElementById(
"lockBtn"
).classList.remove("hidden");

document.getElementById(
"lockStatus"
).innerHTML =
"🟢 Editing unlocked — you can modify the inspection";


render();

}else{

alert("❌ Incorrect password.");

}

};


/* =========================================
   LOCK
   ========================================= */

window.lockEditing = function(){

editingUnlocked = false;

document.getElementById(
"editControls"
).classList.add("hidden");

document.getElementById(
"resetBtn"
).classList.add("hidden");

document.getElementById(
"lockBtn"
).classList.add("hidden");

document.getElementById(
"lockStatus"
).innerHTML =
"🔒 Viewing mode — editing is locked";


render();

};


/* =========================================
   DATABASE LISTENER
   ========================================= */

onValue(

inspectionRef,

(snapshot)=>{

const firebaseData =
snapshot.val();


if(!firebaseData){

data = {

orgs:createDefaultOrganisations(),

day:1

};

currentDay = 1;


/*
Only initialize the database if
editing is unlocked.
*/

if(editingUnlocked){

set(
inspectionRef,
data
);

}

}else{

data = firebaseData;

if(!Array.isArray(data.orgs)){

data.orgs = [];

}

currentDay =
Number(data.day) || 1;

}


document.getElementById(
"connectionStatus"
).innerHTML =
"🟢 Connected — live shared data";


render();

},

(error)=>{

console.error(error);

document.getElementById(
"connectionStatus"
).innerHTML =
"🔴 Database connection error";

}

);


/* =========================================
   SAVE
   ========================================= */

function save(){

if(!editingUnlocked){

alert(
"🔒 Unlock editing first."
);

return;

}


data.day = currentDay;

set(
inspectionRef,
data
);

}


/* =========================================
   ADD ORGANISATION
   ========================================= */

window.addOrg = function(){

if(!editingUnlocked){

alert(
"🔒 Unlock editing first."
);

return;

}


const input =
document.getElementById("orgName");

const name =
input.value.trim();


if(!name){

alert(
"Enter an organisation name."
);

return;

}


if(
data.orgs.some(
o =>
o.name.toLowerCase() ===
name.toLowerCase()
)
){

alert(
"Organisation already exists."
);

return;

}


data.orgs.push({

name:name,

scores:Array.from(
{length:7},
()=>Array(10).fill(0)
)

});


input.value = "";

save();

};


/* =========================================
   REMOVE ORGANISATION
   ========================================= */

window.removeOrg = function(i){

if(!editingUnlocked){

alert(
"🔒 Unlock editing first."
);

return;

}


if(
confirm(
"Remove " +
data.orgs[i].name +
"? This affects everyone."
)
){

data.orgs.splice(i,1);

save();

}

};


/* =========================================
   SET SCORE
   ========================================= */

window.setScore = function(
oi,
ci,
value
){

if(!editingUnlocked){

render();

return;

}


let val =
Math.max(
0,
Math.min(
1,
Number(value) || 0
)
);


if(!data.orgs[oi]){
return;
}


if(!data.orgs[oi].scores){

data.orgs[oi].scores =
Array.from(
{length:7},
()=>Array(10).fill(0)
);

}


if(!data.orgs[oi].scores[currentDay-1]){

data.orgs[oi].scores[currentDay-1] =
Array(10).fill(0);

}


data.orgs[oi]
.scores[currentDay-1][ci] =
val;


save();

};


/* =========================================
   DAY TOTAL
   ========================================= */

function dayTotal(o,d){

if(
!o.scores ||
!o.scores[d]
){

return 0;

}


return o.scores[d].reduce(
(a,b) =>
a + Number(b || 0),
0
);

}


/* =========================================
   WEEK TOTAL
   ========================================= */

function weekTotal(o){

if(!o.scores){

return 0;

}


return o.scores.flat().reduce(
(a,b) =>
a + Number(b || 0),
0
);

}


/* =========================================
   CHANGE DAY
   ========================================= */

window.changeDay = function(day){

currentDay = day;

render();

};


/* =========================================
   RENDER TABS
   ========================================= */

function renderTabs(){

document.getElementById(
"tabs"
).innerHTML =

Array.from(
{length:7},
(_,i)=>`

<button
class="tab ${
currentDay === i+1
? "active"
: ""
}"
onclick="changeDay(${i+1})"
>

Day ${i+1}

</button>

`
).join("");

}


/* =========================================
   RENDER
   ========================================= */

function render(){

renderTabs();


const main =
document.getElementById("main");


if(!data.orgs.length){

main.innerHTML =
`
<div class="empty">

No organisations added yet.

</div>
`;

return;

}


/* Make sure scores exist */

data.orgs.forEach(o=>{

if(!o.scores){

o.scores =
Array.from(
{length:7},
()=>Array(10).fill(0)
);

}

if(!o.scores[currentDay-1]){

o.scores[currentDay-1] =
Array(10).fill(0);

}

});


/* Sort by weekly score */

let sorted =

data.orgs
.map((o,i)=>({

o:o,
i:i

}))
.sort(
(a,b)=>
weekTotal(b.o) -
weekTotal(a.o)
);


/* Build rows */

let rows =

sorted.map(
(x,rank)=>{

const o = x.o;

const i = x.i;


return `

<tr>

<td>

<span class="rank">
#${rank+1}
</span>

${escapeHtml(o.name)}

${
editingUnlocked
?
`

<br>

<button
class="danger"
style="
font-size:11px;
padding:5px 8px;
margin-top:5px
"
onclick="removeOrg(${i})"
>

Remove

</button>

`
:
""
}

</td>


${
categories.map(
(c,ci)=>`

<td>

<input

class="score"

type="number"

min="0"

max="1"

step="1"

value="${
o.scores[currentDay-1][ci] || 0
}"

title="${escapeHtml(c)}"

${
editingUnlocked
? ""
: "disabled"
}

onchange="
setScore(
${i},
${ci},
this.value
)
"

>

</td>

`
).join("")
}


<td class="total">

${dayTotal(
o,
currentDay-1
)}/10

</td>


<td class="total">

${weekTotal(o)}/70

</td>

</tr>

`;

}
).join("");


/* Build table */

main.innerHTML = `

<h2>
Day ${currentDay} Inspection
</h2>

<div style="overflow:auto">

<table>

<thead>

<tr>

<th>
Organisation
</th>


${categories.map(
(c,i)=>`

<th
title="${escapeHtml(c)}"
>

C${i+1}

<br>

<span class="max">

${escapeHtml(c)}

</span>

</th>

`
).join("")}


<th>
Day Total
</th>

<th>
Week Total
</th>

</tr>

</thead>


<tbody>

${rows}

</tbody>

</table>

</div>


<div class="note">

C1 = Response time ·
C2 = Senior control ·
C3 = Activeness ·
C4 = Accomplishments ·
C5 = Behavior ·
C6 = RP knowledge ·
C7 = Teamwork ·
C8 = Communication ·
C9 = Responsibility ·
C10 = Overall.

</div>

`;

}


/* =========================================
   RESET ALL
   ========================================= */

window.clearAll = function(){

if(!editingUnlocked){

alert(
"🔒 Unlock editing first."
);

return;

}


if(
confirm(
"⚠️ Reset ALL points for ALL organisations? " +
"Organisation names will stay unchanged."
)
){

data.orgs.forEach(o=>{

o.scores =
Array.from(
{length:7},
()=>Array(10).fill(0)
);

});


currentDay = 1;

data.day = 1;

save();

}

};


/* =========================================
   ESCAPE HTML
   ========================================= */

function escapeHtml(s){

return String(s).replace(
/[&<>"']/g,
m=>({

'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'

}[m])
);

}


/* =========================================
   INITIAL RENDER
   ========================================= */

render();

</script>

</body>
</html>
